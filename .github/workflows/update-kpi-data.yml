name: Update KPI data

# Weekly check of the public sources; the dashboard is rebuilt and committed only
# when at least one source file actually changed.
on:
  schedule:
    - cron: '17 5 * * 1'   # every Monday 05:17 UTC (07:17 Vilnius time in winter)
  workflow_dispatch:        # "Run workflow" button in the Actions tab

permissions:
  contents: write
  pages: write

concurrency:
  group: update-kpi-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download latest public data
        run: python scripts/fetch_data.py data/duomenys

      - name: Check for changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --porcelain data/
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No source data changed - dashboard left as is."
          fi

      - name: Rebuild dashboard
        if: steps.diff.outputs.changed == 'true'
        run: python build_dashboard.py

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ kpi_data.json index.html
          git commit -m "Automatic KPI data update $(date -u +%Y-%m-%d)"
          git push

      - name: Request GitHub Pages rebuild
        if: steps.diff.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
